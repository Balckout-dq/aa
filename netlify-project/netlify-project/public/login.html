<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal Crypté // CONNEXION BLACKOUT</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech-Mono&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #030304;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
        }

        .login-terminal-window {
            width: 480px;
            max-width: 90vw;
            background: rgba(5, 5, 8, 0.92);
            border: 2px solid var(--terminal-green-dim);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.15), inset 0 0 40px rgba(0, 0, 0, 0.9);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(6px);
            animation: box-flicker 5s infinite;
        }

        .window-top-bar {
            height: 38px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px dashed var(--terminal-green-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .window-body {
            padding: 2.2rem 2rem;
        }

        .login-header-box {
            border-bottom: 1px dashed var(--terminal-green-dim);
            padding-bottom: 1.2rem;
            margin-bottom: 1.8rem;
            text-align: center;
        }

        .login-header-box h1 {
            color: #fff;
            font-size: 1.6rem;
            margin: 0 0 0.4rem 0;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--terminal-green-dim);
        }

        .login-header-box p {
            margin: 0;
            color: var(--terminal-green);
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .input-group-cyber {
            margin-bottom: 1.4rem;
        }

        .input-group-cyber label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--terminal-green);
        }

        .input-wrap {
            display: flex;
            align-items: center;
            background: rgba(0, 255, 65, 0.04);
            border: 1px solid var(--terminal-green-dim);
            padding: 0.6rem 0.9rem;
            transition: all 0.2s;
        }

        .input-wrap:focus-within {
            border-color: var(--terminal-green);
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.3);
            background: rgba(0, 255, 65, 0.08);
        }

        .input-wrap span {
            color: var(--terminal-green);
            margin-right: 0.6rem;
            font-size: 0.9rem;
            opacity: 0.7;
            user-select: none;
        }

        .input-wrap input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.05rem;
            outline: none;
        }

        .quick-fill-row {
            display: flex;
            gap: 10px;
            margin-bottom: 1.8rem;
        }

        .btn-fill {
            flex: 1;
            background: rgba(0, 255, 65, 0.04);
            border: 1px dashed var(--terminal-green-dim);
            color: var(--terminal-green);
            font-family: 'Share Tech Mono', monospace;
            padding: 0.6rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-fill:hover {
            background: rgba(0, 255, 65, 0.2);
            color: #fff;
            border-color: var(--terminal-green);
        }

        .btn-login-submit {
            width: 100%;
            padding: 1rem;
            background: var(--terminal-green);
            color: #000;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            font-size: 1.05rem;
            border: none;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 18px rgba(0, 255, 65, 0.35);
            transition: all 0.2s;
        }

        .btn-login-submit:hover {
            background: #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
            color: #000;
        }

        #error-msg {
            color: var(--terminal-red);
            text-shadow: 0 0 5px rgba(255, 0, 60, 0.5);
            margin-top: 1.2rem;
            display: none;
            font-weight: bold;
            text-align: center;
            font-size: 0.9rem;
        }

        .db-footer-status {
            margin-top: 1.8rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--terminal-green-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <canvas id="matrix-bg"></canvas>
    <div class="overlay-noise"></div>
    <div class="scanlines"></div>

    <div class="login-terminal-window">
        <div class="window-top-bar">
            <span>CONNEXION // BLACKOUT_OS v2.4</span>
            <div class="window-controls">
                <span>_</span>
                <span>[]</span>
                <span>X</span>
            </div>
        </div>

        <div class="window-body">
            <div class="login-header-box">
                <div class="encryption-status" style="justify-content: center; margin-bottom: 0.6rem;">
                    <span class="pulse"></span> CANAL CRYPTÉ ACTIF
                </div>
                <h1>BLACKOUT_LOGIN</h1>
                <p>> AUTHENTIFICATION BASE DE DONNÉES BACKEND</p>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); attemptLogin();">
                <div class="input-group-cyber">
                    <label for="username">> ID UTILISATEUR</label>
                    <div class="input-wrap">
                        <span>[USER]></span>
                        <input type="text" id="username" required placeholder="admin ou user" autocomplete="off">
                    </div>
                </div>

                <div class="input-group-cyber">
                    <label for="password">> MOT DE PASSE</label>
                    <div class="input-wrap">
                        <span>[PASS]></span>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn-login-submit">> ACCÉDER AU SYSTÈME</button>
            </form>

            <p id="error-msg">❌ IDENTIFIANTS REJETÉS PAR LE BACKEND DB</p>

            <div class="db-footer-status">
                <span id="dbStatus" class="exploit">● SERVEUR DB : CONNECTÉ</span>
                <span style="opacity: 0.5;">STATUS: ENCRYPTED</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
